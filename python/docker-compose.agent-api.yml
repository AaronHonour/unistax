# Agent API + PostgreSQL for local/staging use.
#   cp .env.agent-api.example .env && edit the secrets
#   docker compose -f docker-compose.agent-api.yml up --build
#
# The API is deliberately a single replica: it keeps agents, task scheduling and
# the WebSocket event stream in process memory.
services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent-api
    environment:
      UNISTAX_AGENT_API_JWT_SECRET: ${UNISTAX_AGENT_API_JWT_SECRET:?set a signing secret of 32+ characters}
      UNISTAX_AGENT_API_DATABASE_URL: postgresql+asyncpg://agents:${POSTGRES_PASSWORD:?set a database password}@postgres:5432/agents
      UNISTAX_AGENT_API_CORS_ORIGINS: ${UNISTAX_AGENT_API_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
      POSTGRES_DB: agents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
