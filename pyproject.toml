[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unistax"
version = "0.5.0"
description = "High-performance composable full-stack framework: Database, Tasks, Tracing, API, DTOs, Pagination, Audit, Features, Storage, Queue, Notifications, Query, Algorithms - everything needed for production-ready applications (100K RPS capable)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aaron Honour", email = "aaron@example.com"}
]
keywords = ["unistax", "full-stack", "backend", "toolkit", "api", "database", "tasks", "tracing", "audit", "features", "storage", "queue", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution
    "pytest-mock>=3.12.0",  # Enhanced mocking
    "pytest-timeout>=2.2.0",  # Test timeouts
    "pytest-randomly>=3.15.0",  # Randomize test order
    "hypothesis>=6.92.0",  # Property-based testing
    "locust>=2.20.0",  # Load testing
    "memory-profiler>=0.61.0",  # Memory profiling
    "faker>=22.0.0",  # Test data generation
    "freezegun>=1.4.0",  # Time mocking
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML",
    "types-requests",
]

# HTTP client support
http = [
    "requests>=2.28.0",
]

# Cache backends
cache = [
    "redis>=4.5.0",
    "pymemcache>=4.0.0",
]

# Metrics backends
metrics = [
    "prometheus-client>=0.16.0",
    "statsd>=4.0.0",
]

# Database support
database = [
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",  # Async SQLite
    "psycopg2-binary>=2.9.0",  # PostgreSQL
    "pymysql>=1.0.0",  # MySQL
    "alembic>=1.13.0",  # Migrations
]

# Task queue support
tasks = [
    "celery>=5.2.0",
    "redis>=4.5.0",
    "apscheduler>=3.10.0",  # Scheduler
]

# Tracing support
tracing = [
    "opentelemetry-api>=1.15.0",
    "opentelemetry-sdk>=1.15.0",
    "opentelemetry-instrumentation>=0.36b0",
    "opentelemetry-exporter-jaeger>=1.15.0",
    "opentelemetry-exporter-zipkin>=1.15.0",
    "opentelemetry-exporter-otlp>=1.15.0",
]

# API framework support
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.25.0",  # HTTP client for async requests
    "python-multipart>=0.0.6",  # File upload support
]

# File storage support
storage = [
    "boto3>=1.34.0",  # AWS S3
    "azure-storage-blob>=12.19.0",  # Azure Blob
    "google-cloud-storage>=2.14.0",  # Google Cloud Storage
]

# Message queue support
queue = [
    "redis>=4.5.0",
    "pika>=1.3.0",  # RabbitMQ
]

# Notification support
notifications = [
    "twilio>=8.11.0",  # SMS
    "sendgrid>=6.11.0",  # Email
]

# Security extras
security = [
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
]

# Performance optimizations
performance = [
    "orjson>=3.9.0",  # 3x faster JSON serialization
    "msgpack>=1.0.0",  # Binary serialization, 5x faster
    "lz4>=4.3.0",  # Ultra-fast compression (15x faster than zlib)
    "python-snappy>=0.6.0",  # Fast compression for databases
]

# All optional dependencies
all = [
    "requests>=2.28.0",
    "redis>=4.5.0",
    "pymemcache>=4.0.0",
    "prometheus-client>=0.16.0",
    "statsd>=4.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.0.0",
    "alembic>=1.13.0",
    "celery>=5.2.0",
    "apscheduler>=3.10.0",
    "opentelemetry-api>=1.15.0",
    "opentelemetry-sdk>=1.15.0",
    "opentelemetry-exporter-jaeger>=1.15.0",
    "opentelemetry-exporter-zipkin>=1.15.0",
    "opentelemetry-exporter-otlp>=1.15.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "boto3>=1.34.0",
    "azure-storage-blob>=12.19.0",
    "google-cloud-storage>=2.14.0",
    "pika>=1.3.0",
    "twilio>=8.11.0",
    "sendgrid>=6.11.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "orjson>=3.9.0",
    "msgpack>=1.0.0",
    "lz4>=4.3.0",
    "python-snappy>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/AaronHonour/unistax"
Documentation = "https://github.com/AaronHonour/unistax#readme"
Repository = "https://github.com/AaronHonour/unistax"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/unistax --cov-report=term-missing"
markers = [
    "benchmark: marks tests as benchmark tests (deselect with '-m \"not benchmark\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
